# /etc/nginx/sites-available/telephony.conf   (symlink into sites-enabled)
#
#   1. point telephony.yourdomain.com  A record → this VPS
#   2. sudo certbot --nginx -d telephony.yourdomain.com
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# This proxies ONLY the integration API. VICIdial's own admin/agent vhosts
# are separate and should NOT be reachable from the public internet
# (bind to localhost / IP-allow / basic-auth).

server {
    listen 80;
    server_name telephony.yourdomain.com;
    # certbot rewrites this to 443 + redirect. Until then, allow ACME only:
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name telephony.yourdomain.com;

    # ssl_certificate / ssl_certificate_key added by certbot

    # only the integration service — nothing else
    client_max_body_size 2m;

    # basic rate limit (defined in http{} — see below)
    limit_req zone=telephony_api burst=40 nodelay;

    location = /healthz {
        proxy_pass http://127.0.0.1:4000/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
        # recordings can be larger:
        proxy_buffering off;
    }

    # never proxy these even by accident
    location ~* ^/(vicidial|agc|admin|phpmyadmin) { return 404; }
}

# Add to /etc/nginx/nginx.conf inside http { } :
#   limit_req_zone $binary_remote_addr zone=telephony_api:10m rate=20r/s;
